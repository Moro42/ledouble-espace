<title>Dépense · LE DOUBLE</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#ECE8E2;--surface:#FFFFFF;--surface2:#E3DED6;--ink:#120E0A;--ink-soft:#4A4238;--soft:#4A4238;--line:#CFC6B9;--accent:#A87A3A;--accent-strong:#6E4A17;--gold:#E9C27F;--ok:#11703A;--ok-bg:#E4F1E9;--warn:#B06A08;--warn-bg:#FBEBD3;--danger:#9E1F15;--danger-bg:#F7E3E1;--sel:#F2E1C4;--font:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.top{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.top button{background:none;border:0;color:#BDB3A6;font-size:14px}
main{max-width:480px;margin:0 auto;padding:14px 16px 28px;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.montant{font-size:46px;font-weight:800;text-align:center;letter-spacing:-.02em;padding:6px 0 2px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--soft)}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kp button{background:var(--bg);border:0;border-radius:12px;min-height:56px;font-size:24px;font-weight:700;color:var(--ink)}
.kp button:active{background:var(--sel)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink);min-height:44px}
.chip.on{background:var(--sel);border-color:var(--accent-strong)}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:14px;min-height:56px;font-weight:700;color:var(--soft);cursor:pointer}
.photo.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
input.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
.btn{width:100%;border:0;border-radius:14px;min-height:60px;font-size:18px;font-weight:800;background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);min-height:48px;font-size:15px}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #E3DED6;font-size:15px}
.ligne:last-child{border-bottom:0}
.ligne button{background:none;border:0;color:var(--danger);font-weight:700;font-size:14px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none!important}
.err{color:var(--danger);font-weight:700}
</style>
</head>

<main id="login" class="hidden">
  <div class="card" style="display:grid;gap:10px">

<main id="app" class="hidden">
  <div class="card">
    <div class="note" style="text-align:center" id="date"></div>
    <div class="montant" id="montant">0,00 €</div>
    <div class="kp" id="kp">
      <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>00</button><button>0</button><button aria-label="Effacer">⌫</button>
    </div>
  </div>
  <div class="card"><div class="lbl">Quoi ?</div><div class="chips" id="cats"></div></div>
  <div class="card"><div class="lbl">Payé avec</div><div class="chips" id="paie"></div></div>
  <label class="photo" id="photoLbl">📷 Photo du ticket (facultatif)<input type="file" id="photo" accept="image/*" capture="environment" class="hidden"></label>
  <input class="in" id="noteIn" maxlength="120" placeholder="Note (facultatif)">

<div class="toast" id="toast"></div>
<script>
var firebaseConfig={apiKey:"AIzaSyCnoN3QvJwxZ7iymoATF-yYgdYv-kKJNtM",authDomain:"ledouble.firebaseapp.com",projectId:"ledouble",storageBucket:"ledouble.firebasestorage.app",messagingSenderId:"948714321304",appId:"1:948714321304:web:820d0f89be59512d49a7ed"};
var PROPRIO='h.amrani0001@gmail.com';
var appFb=firebase.initializeApp(firebaseConfig,'proprietaire');   // même session que ton espace propriétaire
var auth=appFb.auth(), db=appFb.firestore();
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function jour(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hhmm(d){d=d||new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function eur(c){return (c/100).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' €'}
function toast(t){var e=$('toast');e.textContent=t;e.className='toast on';clearTimeout(e._t);e._t=setTimeout(function(){e.className='toast'},2200)}
var CATS_DEFAUT=['Courses magasin','Emballages','Entretien','Petit matériel','Carburant','Parking','Autre'];
var PAIE=['Carte pro','Espèces','Perso (à rembourser)'];
var S={cents:0,cat:null,paie:null,photo:null,cats:CATS_DEFAUT};
try{ S.paie=localStorage.getItem('ld-dep-paie')||'Carte pro'; }catch(e){ S.paie='Carte pro'; }
function majMontant(){ $('montant').textContent=eur(S.cents); $('ok').disabled=!(S.cents>0&&S.cat); $('ok').textContent=S.cents>0?'Enregistrer · '+eur(S.cents):'Enregistrer'; }
function chips(id,liste,val,attr){ $(id).innerHTML=liste.map(function(x){ return '<button class="chip'+(x===val?' on':'')+'" data-'+attr+'="'+esc(x)+'">'+esc(x)+'</button>'; }).join(''); }
function rendre(){ chips('cats',S.cats,S.cat,'cat'); chips('paie',PAIE,S.paie,'paie'); majMontant(); }
$('kp').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var t=b.textContent;
  if(t==='⌫') S.cents=Math.floor(S.cents/10); else if(t==='00') S.cents=Math.min(S.cents*100,9999999); else S.cents=Math.min(S.cents*10+parseInt(t,10),9999999);
  majMontant(); };
document.addEventListener('click',function(e){ var b=e.target.closest('[data-cat],[data-paie],[data-supp]'); if(!b) return;
  if(b.hasAttribute('data-cat')){ S.cat=b.getAttribute('data-cat'); rendre(); }
  if(b.hasAttribute('data-paie')){ S.paie=b.getAttribute('data-paie'); try{ localStorage.setItem('ld-dep-paie',S.paie); }catch(x){} rendre(); }
  if(b.hasAttribute('data-supp')){ if(!confirm('Supprimer cette dépense ?')) return; var id=b.getAttribute('data-supp');
    Promise.all([db.collection('depenses').doc(id).delete(),db.collection('depenses_img').doc(id).delete().catch(function(){})]).then(function(){ toast('Supprimée'); }).catch(function(er){ alert('Suppression impossible ('+(er.code||er.message)+')'); }); }
});
/* photo du ticket : réduite pour rester légère */
function compresser(f){ return new Promise(function(ok,ko){ var r=new FileReader(); r.onload=function(){ var im=new Image(); im.onload=function(){ var m=1400, w=im.width, h=im.height, k=Math.min(1,m/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',0.72).split(',')[1]); }; im.onerror=ko; im.src=r.result; }; r.onerror=ko; r.readAsDataURL(f); }); }
$('photo').onchange=function(){ var f=this.files&&this.files[0]; this.value=''; if(!f) return; $('photoLbl').firstChild.textContent='Photo en préparation… ';
  compresser(f).then(function(d){ S.photo=d; $('photoLbl').className='photo ok'; $('photoLbl').firstChild.textContent='✓ Ticket photographié (toucher pour reprendre) '; }).catch(function(){ $('photoLbl').firstChild.textContent='📷 Photo du ticket (facultatif) '; alert('Photo illisible, réessaie.'); }); };
$('ok').onclick=function(){
  if(!(S.cents>0&&S.cat)) return; var b=this; b.disabled=true;
  var ref=db.collection('depenses').doc(), now=new Date();
  var d={montant:S.cents,categorie:S.cat,paiement:S.paie,aRembourser:S.paie.indexOf('Perso')===0,note:$('noteIn').value.trim(),jour:jour(now),mois:jour(now).slice(0,7),h:hhmm(now),tsClient:now.getTime(),photo:!!S.photo};
  (S.photo?db.collection('depenses_img').doc(ref.id).set({media:'image/jpeg',data:S.photo}):Promise.resolve()).then(function(){ return ref.set(d); }).then(function(){
    toast('Dépense notée : '+eur(S.cents)); S.cents=0; S.cat=null; S.photo=null; $('noteIn').value=''; $('photoLbl').className='photo'; $('photoLbl').firstChild.textContent='📷 Photo du ticket (facultatif) '; rendre();
  }).catch(function(er){ b.disabled=false; alert('Enregistrement impossible ('+(er.code||er.message)+'). Vérifie ta connexion.'); });
};
function suivreJour(){
  db.collection('depenses').where('jour','==',jour()).onSnapshot(function(s){
    var l=s.docs.map(function(d){ var o=d.data(); o.__id=d.id; return o; }).sort(function(a,b){ return b.tsClient-a.tsClient; }), t=0;
    l.forEach(function(x){ t+=x.montant; });
    $('jour').innerHTML=l.length?l.map(function(x){ return '<div class="ligne"><span>'+esc(x.h)+' · '+esc(x.categorie)+(x.photo?' 📷':'')+'<br><span class="note">'+esc(x.paiement)+(x.note?' · '+esc(x.note):'')+'</span></span><span style="text-align:right"><b>'+eur(x.montant)+'</b><br><button data-supp="'+x.__id+'">Supprimer</button></span></div>'; }).join('')+'<div class="ligne"><b>Total du jour</b><b>'+eur(t)+'</b></div>':'<p class="note" style="margin:0">Aucune dépense notée aujourd’hui.</p>';
  },function(e){ $('jour').innerHTML='<p class="err">Lecture impossible ('+e.code+')</p>'; });
}
function demarrer(){
  $('date').textContent='Nouvelle dépense · '+new Date().toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'});
  db.collection('config').doc('depenses').get().then(function(s){ var c=s.exists&&s.data().categories; if(Array.isArray(c)&&c.length) S.cats=c; rendre(); }).catch(function(){ rendre(); });
  rendre(); suivreJour();
}
$('lgBtn').onclick=function(){ $('lgErr').textContent=''; auth.signInWithEmailAndPassword($('lgEmail').value.trim(),$('lgPass').value).catch(function(){ $('lgErr').textContent='E-mail ou mot de passe incorrect.'; }); };
$('quitter').onclick=function(){ auth.signOut(); };
auth.onAuthStateChanged(function(u){
  var ok=u&&String(u.email||'').toLowerCase()===PROPRIO;
  if(u&&!ok){ auth.signOut(); $('lgErr').textContent='Cette page est réservée au propriétaire.'; }
  $('chargement').className='hidden';
  $('login').className=ok?'hidden':''; $('app').className=ok?'':'hidden'; $('quitter').className=ok?'':'hidden';
  if(ok&&!S.lance){ S.lance=true; demarrer(); }
});
</script>
