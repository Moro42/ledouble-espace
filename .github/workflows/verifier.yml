name: Vérifier les modifications de l'assistant

on:
  push:
    branches: [assistant]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vérifier le code des pages
        run: |
          node -e '
          const fs=require("fs");
          for (const f of ["index.html","gerant.html"]) {
            if (!fs.existsSync(f)) continue;
            const h=fs.readFileSync(f,"utf8");
            if (!h.includes("</html>")) { console.error(f+" : fichier incomplet"); process.exit(1); }
            const scripts=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            if (!scripts.length) { console.error(f+" : aucun script"); process.exit(1); }
            scripts.forEach((js,i)=>{ try { new Function(js); } catch(e) { console.error(f+" script "+i+" : "+e.message); process.exit(1); } });
            console.log(f+" : OK ("+scripts.length+" scripts)");
          }'
